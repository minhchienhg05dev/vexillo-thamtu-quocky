<div id="app">
  <header id="masthead">

<script>
(() => {
  'use strict';
  const DATA = window.VEXILLO_DATA;
  const PHOTOS = window.VEXILLO_IMAGES;
  if(!DATA||!PHOTOS||!Array.isArray(DATA.rows)||!PHOTOS.files){
    document.getElementById('stage').textContent='Không đọc được dữ liệu quốc kỳ.';
    return;
  }
  const F = DATA.features;
  const N = DATA.rows.length;
  const MIN_COUNT = Math.ceil(N * .1);
  const MIN_CONF = .6;
  const QUESTION_SECONDS = 120;
  const LABEL = {red:'Màu đỏ',green:'Xanh lá',blue:'Xanh dương',gold:'Màu vàng',white:'Màu trắng',black:'Màu đen',orange:'Màu cam',bars:'Sọc dọc',stripes:'Sọc ngang',circles:'Hình tròn',crosses:'Chữ thập',saltires:'Chữ thập chéo',quarters:'Chia bốn ô',triangle:'Tam giác',sunstars:'Mặt trời / sao',crescent:'Trăng lưỡi liềm',icon:'Hình đồ vật',animate:'Hình sinh vật',text:'Chữ viết'};
  const GROUPS = [['Màu sắc',['red','green','blue','gold','white','black','orange']],['Biểu tượng',['crescent','triangle','icon','animate','text']],['Hình học',['bars','stripes','circles','crosses','saltires','quarters','sunstars']]];
  const COLORS = {red:'#cb3e47',green:'#2f8a5f',blue:'#2866a8',gold:'#d8a931',white:'#fff',black:'#222',orange:'#e87d2d'};
  const ICON = {bars:'▥',stripes:'☰',circles:'◯',crosses:'✚',saltires:'✕',quarters:'▦',triangle:'▲',sunstars:'★',crescent:'☾',icon:'◇',animate:'♞',text:'A'};
  const rowMasks = DATA.rows.map(r=>Object.fromEntries(F.map((f,j)=>[f,r[1][j]==='1'])));
  const matches = features => DATA.rows.map((r,i)=>features.every(f=>rowMasks[i][f]));
  const count = features => matches(features).filter(Boolean).length;
  const pct = (value,digits=0)=>new Intl.NumberFormat('vi-VN',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(value*100)+'%';
  const num = x=>new Intl.NumberFormat('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(x);
  const escapeText = text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const name = i=>DATA.rows[i][0].replace(/-/g,' ');
  const meta = i=>PHOTOS.meta[DATA.rows[i][0]];
  const url = i=>PHOTOS.files[(meta(i)||{}).key||DATA.iso[i]];
  function flag(i, cls='') {
    if (i===undefined || !url(i)) return '';
    const className = ['flag-image', cls].filter(Boolean).join(' ');
    return `<img class="${className}" src="${url(i)}" alt="Cờ ${escapeText(name(i))}" loading="lazy" decoding="async" draggable="false">`;
  }
  const candidates = features => matches(features).flatMap((yes,i)=>yes?[i]:[]);
  const priority = i=>{const m=meta(i);return m && /Phỏng dựng|chưa xác thực/i.test(m.quality)?2:m?0:1;};
  function sample(features,avoid=[]) {
    const choices=candidates(features).sort((a,b)=>priority(a)-priority(b));
    return choices.find(i=>!avoid.includes(i))??choices[0];
  }
  function featureMark(f){return COLORS[f]?`<span class="swatch" style="background:${COLORS[f]}"></span>`:`<span aria-hidden="true" style="font-size:17px;width:17px;line-height:1;text-align:center">${ICON[f]}</span>`;}
  function chips(features){return features.map(f=>`<span class="feature-chip">${featureMark(f)}${escapeText(LABEL[f])}</span>`).join('');}
  function bankQuestions(){
    const antecedents=[];F.forEach((a,i)=>{antecedents.push([a]);for(let j=i+1;j<F.length;j++) antecedents.push([a,F[j]]);});
    return antecedents.flatMap(ifItems=>{
      const nIf=count(ifItems);if(nIf<MIN_COUNT)return [];
      const options=F.filter(t=>!ifItems.includes(t)).flatMap(then=>{
        const nBoth=count([...ifItems,then]);if(nBoth<MIN_COUNT)return [];
        const nThen=count([then]),conf=nBoth/nIf,lift=conf/(nThen/N);
        return conf>=MIN_CONF&&lift>1?[{then,nIf,nBoth,nThen,conf,lift}]:[];
      }).sort((a,b)=>b.lift-a.lift);
      return options.length>=3 && options[0].lift-options[1].lift>.10?[{ifItems,ranked:options.slice(0,3)}]:[];
    });
  }
  const BANK=bankQuestions();
  const ROUNDS=Math.min(10,BANK.length);
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  let game={stage:'intro'};
  let tab='play',page=0,selected=['green','icon'];
  let queued=0;
  let isTransitioning=false;
  const stage=document.getElementById('stage');
  const animateSwap=fn=>{
    if(isTransitioning)return;
    const current=stage.firstElementChild;
    if(!current){fn();return;}
    isTransitioning=true;
    // Browser-managed stage snapshots keep navigation continuous without changing the game model.
    if(typeof document.startViewTransition==='function'){
      try{
        const transition=document.startViewTransition(()=>fn());
        transition.finished.finally(()=>{isTransitioning=false;});
        return;
      }catch(error){isTransitioning=false;console.warn('View transition fallback',error);}
    }
    isTransitioning=true;
    const id=++queued;
    current.classList.add('scene-out');
    const wipe=document.getElementById('transition-cover');
    wipe.classList.remove('active');void wipe.offsetWidth;wipe.classList.add('active');
    window.setTimeout(()=>{if(id!==queued)return;fn();},330);
    window.setTimeout(()=>{if(id===queued){wipe.classList.remove('active');isTransitioning=false;}},720);
  };
  function render(){
    const active=document.activeElement;
    const hadStageFocus=active&&stage.contains(active);
    const previousFeature=hadStageFocus?active.getAttribute('data-feature'):null;
    const previousId=hadStageFocus?active.id:null;
    document.getElementById('tab-play').setAttribute('aria-selected',String(tab==='play'));
    document.getElementById('tab-explore').setAttribute('aria-selected',String(tab==='explore'));
    if(tab==='play'&&game.stage==='guess'&&remainingSeconds()===0)finishAnswer(null,true);
    const html=tab==='explore'?renderExplore():game.stage==='intro'?renderIntro():game.stage==='guess'?renderQuestion():game.stage==='reveal'?renderReveal():renderFinish();
    stage.innerHTML=`<section class="panel scene" id="view-${tab}" role="tabpanel" aria-labelledby="tab-${tab}">${html}</section>`;
    if(tab==='explore')bindExplore();else bindGame();
    if(hadStageFocus){
      let next=previousFeature?stage.querySelector(`[data-feature="${previousFeature}"]`):null;
      if(!next&&previousId)next=stage.querySelector(`[id="${previousId}"]`);
      if(!next)next=stage.querySelector('h1,h2');
      if(next){if(!next.matches('button,input,[tabindex]'))next.tabIndex=-1;next.focus({preventScroll:true});}
    }
  }
  const switchTab=newTab=>{
    if(newTab===tab||isTransitioning||!dialog.hidden)return;
    animateSwap(()=>{tab=newTab;render();});
  };
  document.getElementById('tab-play').addEventListener('click',()=>switchTab('play'));
  document.getElementById('tab-explore').addEventListener('click',()=>switchTab('explore'));
  document.addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    if(isTransitioning)return;
    if(!dialog.hidden){
      if(e.key==='Escape'){closeFlagDialog();e.preventDefault();return;}
      if(e.key==='Tab'){
        const focusables=[...dialog.querySelectorAll('button:not([disabled])')];
        const first=focusables[0],last=focusables[focusables.length-1];
        if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
        else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
      }
      return;
    }
    if(e.key==='Escape'&&tab==='play'&&game.stage!=='intro'){animateSwap(()=>{game={stage:'intro'};render();});return;}
    if(tab==='play'&&game.stage==='guess'&&['1','2','3'].includes(e.key)&&!(e.target instanceof HTMLButtonElement))choose(Number(e.key)-1);
    if(tab==='explore'&&e.key==='ArrowRight')setPage(page+1);
    if(tab==='explore'&&e.key==='ArrowLeft')setPage(page-1);
  });
  function renderIntro(){
    const picks=['Vietnam','Japan','Brazil','Germany-DDR','Nepal','Seychelles'];
    const rows=picks.map(x=>DATA.rows.findIndex(r=>r[0]===x)).filter(i=>i>=0);
    if(rows.length<6){rows.push(...[0,15,33,60,130,187].filter(i=>!rows.includes(i)).slice(0,6-rows.length));}
    return `<div class="intro">
      <div class="intro-copy">
        <p class="eyebrow">194 quốc kỳ trong bộ dữ liệu UCI Flags</p>
        <h1><span class="title-line">Thám tử</span><span class="title-line second">quốc kỳ</span></h1>
        <p class="intro-desc">Chọn đặc trưng xuất hiện cùng màu sắc và biểu tượng trên quốc kỳ. So sánh bằng Lift. Mỗi câu có 2 phút.</p>
        <div class="rule-preview"><span class="rule-heading">Một câu hỏi sẽ như thế này</span><div class="rule-flow"><div><small>Nếu</small><b>Cờ có màu đỏ</b></div><span class="connector" aria-hidden="true">→</span><div><small>Thì</small><b>Đặc trưng nào đi cùng?</b></div></div></div>
        <div class="intro-cta"><button class="btn primary" id="start">Bắt đầu ${ROUNDS} câu</button><span class="small-note">Tối đa 20 điểm.<br>Xem Lift gợi ý: chỉ 1 điểm khi đúng.</span></div>
      </div><div class="intro-art" aria-label="Bộ sưu tập cờ từ dữ liệu">
        <div class="art-kicker"><span>Bộ sưu tập từ dữ liệu UCI Flags</span><span>19 đặc trưng</span></div>
        <div class="art-grid">${rows.slice(0,6).map((i,k)=>`<div class="art-flag" style="--i:${k}">${flag(i)}<span>${escapeText(name(i))}</span></div>`).join('')}</div>
        
      </div>
    </div>`;
  }
  function questionLeft(q){
    const example=sample(q.ifItems);
    const nIf=q.ranked[0].nIf;
    const remaining=game.stage==='guess'?remainingSeconds():game.remaining;
    const timerLabel=game.stage==='guess'?'Còn lại':game.timedOut?'Hết giờ':'Lúc trả lời';
    return `<div class="question-board"><div class="quiz-stats">
       <span class="step-counter">Câu <b>${game.round+1}</b> / ${ROUNDS}</span>
       <div class="question-timer ${remaining<=20?'timer-warning':''} ${remaining<=10?'timer-critical':''}" id="question-timer" role="timer" aria-label="Thời gian còn lại">
         <span>${timerLabel}</span><strong id="timer-display">${formatTime(remaining)}</strong>
         <span class="timer-track" aria-hidden="true"><i id="timer-fill" style="width:${(remaining/QUESTION_SECONDS)*100}%"></i></span>
       </div>
       <span class="score">${game.score} <small>điểm</small></span></div>
       <h2>Nếu lá cờ có...</h2><p class="if-label">Điều kiện ban đầu</p><div class="feature-chips" style="margin-top:12px">${chips(q.ifItems)}</div>
       <div class="flag-showcase"><div class="flag-surface">${flag(example)}</div><div class="flag-index"><span>Cờ thỏa điều kiện</span><strong>${nIf}<small style="font-size:.4em;color:#84909b">/194</small></strong><span>Ví dụ: <b>${escapeText(name(example))}</b></span><small>Một ví dụ trong nhóm đang xét.</small></div></div>
    </div>`;
  }
  function option(o,i){
    const base=o.nThen/N;
    return `<button class="answer-option" type="button" data-option="${i}" style="--i:${i}" aria-label="Đáp án ${i+1}: ${escapeText(LABEL[o.then])}">
      <span class="option-num">0${i+1}</span>
      <span class="option-info"><strong>${featureMark(o.then)} ${escapeText(LABEL[o.then])}</strong>
        <span class="hint-metrics">
          <span class="ratio"><span>Trong nhóm NẾU</span><i><em style="--value:${pct(o.conf)}"></em></i><b>${pct(o.conf)}</b></span>
          <span class="ratio secondary"><span>Trên 194 cờ</span><i><em style="--value:${pct(base)}"></em></i><b>${pct(base)}</b></span>
          <span class="lift-hint" ${game.hinted?'':'hidden'}>Lift = ${pct(o.conf)} ÷ ${pct(base)} ≈ <b>${num(o.lift)}×</b></span>
        </span>
      </span></button>`;
  }
  function renderQuestion(){
    const q=game.questions[game.round];
    return `<div class="quiz">${questionLeft(q)}<div class="answer-board">
      <div class="answer-top"><div><p class="tiny-label">Chọn vế THÌ</p><h2>Đặc trưng nào có Lift lớn nhất?</h2></div><span class="page-indicator">Chọn 1 đáp án</span></div>
      <div class="option-list">${game.options.map((o,i)=>option(o,i)).join('')}</div>
      <div class="hint-row"><p id="hint-copy">${game.hinted?'Đã hiện Lift của từng đáp án.':'Tự tính Lift = tỷ lệ trong nhóm NẾU ÷ tỷ lệ trên 194 cờ, rồi chọn đáp án lớn nhất.'}</p>
        <button class="btn ghost small" type="button" id="hint" ${game.hinted?'disabled':''}>${game.hinted?'Đã xem Lift':'Gợi ý: xem Lift (đúng chỉ +1 điểm)'}</button></div>
    </div></div>`;
  }
  function renderReveal(){
    const q=game.questions[game.round],best=q.ranked[0],correct=!game.timedOut && game.choice?.then===best.then;
    const all=matches([...q.ifItems,best.then]);
    const yes=all.flatMap((hit,i)=>hit?[name(i)]:[]).slice(0,3);
    const scale=Math.max(...q.ranked.map(o=>o.lift));
    return `<div class="quiz">${questionLeft(q)}<div class="answer-board reveal">
      <div class="reveal-analysis"><p class="tiny-label">Phân tích câu ${game.round+1}</p><h2 class="verdict ${correct?'good':'bad'}">${game.timedOut?'Hết giờ.':correct?'Chính xác.':'Chưa chính xác.'} ${correct?'+'+(game.hinted?1:2):'+0'} điểm</h2>
        <div class="winner-card"><span class="tiny-label" style="color:var(--green)">Đáp án có Lift cao nhất</span><div class="winner">${featureMark(best.then)} ${escapeText(LABEL[best.then])}</div><div>Lift <b style="color:var(--green)">${num(best.lift)}×</b> mức nền</div></div>
        <div class="lift-compare">${q.ranked.map(o=>`<div class="lift-item ${o===best?'best':''}"><span>${escapeText(LABEL[o.then])}</span><i><em style="--size:${Math.max(4,100*o.lift/scale)}%"></em></i><b>${num(o.lift)}×</b></div>`).join('')}</div>
        <p class="example-note">Cờ có cả hai đặc trưng: ${escapeText(yes.join(', '))}.</p>
      </div><div class="reveal-explain"><p class="formula-title">Tính Lift của luật</p>
        <div class="metric-grid"><div class="metric"><label>Support</label><strong>${pct(best.nBoth/N,1)}</strong><small>${best.nBoth} / ${N} cờ</small></div>
        <div class="metric"><label>Confidence</label><strong>${pct(best.conf,1)}</strong><small>${best.nBoth} / ${best.nIf} cờ</small></div>
        <div class="metric"><label>Lift</label><strong>${num(best.lift)}×</strong><small>So với tỷ lệ nền</small></div></div>
        <div class="formula">Lift = (${best.nBoth} / ${best.nIf}) ÷ (${best.nThen} / ${N})<br>= <b>${num(best.lift)}×</b></div>
        <p class="interpretation">Trong nhóm đang xét, đặc trưng này xuất hiện nhiều gấp ${num(best.lift)} lần tỷ lệ của toàn bộ dữ liệu. Đây là mối liên hệ thống kê, không phải quan hệ nhân quả.</p>
        <div class="reveal-action"><span class="subtle">Câu ${game.round+1} / ${ROUNDS}</span><button id="next" class="btn primary">${game.round+1===ROUNDS?'Xem tổng kết':'Câu tiếp theo'} <span aria-hidden="true">→</span></button></div>
      </div>
    </div></div>`;
  }
  function renderFinish(){
    const max=ROUNDS*2;
    const rank='Đã hoàn thành';
    const desc=`Bạn trả lời đúng ${game.results.filter(Boolean).length}/${ROUNDS} câu. Đáp án được xác định bằng Lift, so sánh Confidence với tỷ lệ nền.`;
    const correct = game.results.filter(Boolean).length;
    return `<div class="finish"><div class="finish-copy"><p class="eyebrow">Đã hoàn thành ${ROUNDS} câu</p><h1>${rank}</h1><p class="finish-sub">${desc}</p><div class="finish-score"><strong>${game.score}</strong><span>/ ${max} điểm</span></div><button class="btn primary" id="again">Chơi lại 10 câu</button><button class="btn ghost" id="to-explore" style="margin-left:10px">Tra cứu quốc kỳ</button></div>
      <div class="finish-breakdown"><span class="tiny-label">Kết quả từng câu</span><div class="finish-count"><strong>${correct}</strong><span>/ ${ROUNDS} câu đúng</span></div><div class="finish-segments" role="img" aria-label="${correct} câu đúng trong ${ROUNDS} câu">${game.results.map((ok,i)=>`<span class="${ok?'correct':'incorrect'}" style="--i:${i}" title="Câu ${i+1}: ${ok?'Đúng':'Sai'}"></span>`).join('')}</div><p>Ô màu xanh: câu đúng. Số điểm đã tính cả gợi ý.</p></div></div>`;
  }
  function bindGame(){
    const start=document.getElementById('start');if(start)start.addEventListener('click',()=>animateSwap(()=>{game={stage:'guess',questions:shuffle(BANK).slice(0,ROUNDS),round:0,score:0,results:[],hinted:false};showQuestion();}));
    stage.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.option))));
    const hint=document.getElementById('hint');if(hint)hint.addEventListener('click',()=>{
      if(game.stage!=='guess'||game.hinted||isTransitioning)return;
      if(remainingSeconds()===0){finishAnswer(null,true);return;}
      game.hinted=true;
      hint.disabled=true;hint.textContent='Đã xem Lift';
      document.querySelectorAll('.lift-hint').forEach(node=>node.hidden=false);
      const note=document.getElementById('hint-copy');
      if(note)note.textContent='Đã hiện Lift của từng đáp án.';
    });
    const next=document.getElementById('next');if(next)next.addEventListener('click',()=>animateSwap(()=>{
      game.round++;if(game.round>=ROUNDS){game.stage='done';render();}else showQuestion();
    }));
    const again=document.getElementById('again');if(again)again.addEventListener('click',()=>animateSwap(()=>{game={stage:'guess',questions:shuffle(BANK).slice(0,ROUNDS),round:0,score:0,results:[],hinted:false};showQuestion();}));
    const explore=document.getElementById('to-explore');if(explore)explore.addEventListener('click',()=>switchTab('explore'));
  }
  const formatTime=seconds=>`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
  const remainingSeconds=()=>Math.max(0,Math.ceil((game.deadline-Date.now())/1000));
  function showQuestion(){
    game.stage='guess';game.hinted=false;game.timedOut=false;
    game.options=shuffle(game.questions[game.round].ranked);
    game.remaining=QUESTION_SECONDS;
    game.deadline=Date.now()+QUESTION_SECONDS*1000;
    render();
  }
  function finishAnswer(index,timedOut=false){
    if(game.stage!=='guess')return;
    if(!timedOut && (isTransitioning||!Number.isInteger(index)||index<0||index>=game.options.length))return;
    timedOut=timedOut||remainingSeconds()===0;
    game.remaining=timedOut?0:remainingSeconds();
    game.timedOut=timedOut;
    game.choice=timedOut?null:game.options[index];
    const correct=!timedOut && game.choice.then===game.questions[game.round].ranked[0].then;
    game.stage='reveal';
    game.score+=correct?(game.hinted?1:2):0;
    game.results.push(correct);
    if(tab==='play'&&!isTransitioning)animateSwap(render);
  }
  function choose(index){finishAnswer(index);}
  function tickTimer(){
    if(game.stage!=='guess')return;
    const remaining=remainingSeconds();
    if(remaining===0){finishAnswer(null,true);return;}
    const display=document.getElementById('timer-display');
    if(!display)return;
    display.textContent=formatTime(remaining);
    const fill=document.getElementById('timer-fill');
    if(fill)fill.style.width=(remaining/QUESTION_SECONDS*100)+'%';
    const timer=document.getElementById('question-timer');
    if(timer){timer.classList.toggle('timer-warning',remaining<=20);timer.classList.toggle('timer-critical',remaining<=10);}
  }
  window.setInterval(tickTimer,250);
  document.addEventListener('visibilitychange',tickTimer);
  const PAGE_SIZE=12;
  function matchedRows(){return candidates(selected);}
  function renderExplore(){
    const matched=matchedRows(),totalPages=Math.max(1,Math.ceil(matched.length/PAGE_SIZE));
    page=Math.min(page,totalPages-1);
    const shown=matched.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);
    const example=sample(selected);
    return `<div class="explore"><div class="explore-filter">
      <div class="explore-heading"><div><p class="tiny-label">19 đặc trưng</p><h2>Bộ lọc</h2></div><button id="reset" class="filter-reset">Xóa lọc</button></div>
      <p class="subtle">Chọn các đặc trưng cần có trên lá cờ.</p>
      ${GROUPS.map(([group,features])=>`<div class="filter-group"><p class="filter-group-title">${group}</p><div class="filter-chips">${features.map(f=>`<button class="filter-chip" data-feature="${f}" aria-pressed="${selected.includes(f)}">${featureMark(f)}${LABEL[f]}</button>`).join('')}</div></div>`).join('')}
      <div class="filter-bottom">${flag(example)}<div><b>${matched.length} / ${N}</b><span> bản ghi phù hợp (${pct(matched.length/N,1)})</span><small>${example!==undefined?'Ví dụ: '+escapeText(name(example)):'Không có lá cờ nào thỏa mãn điều kiện đã chọn.'}</small></div></div>
    </div><div class="explore-gallery">
      <div class="gallery-top"><div><p class="tiny-label">Dữ liệu lịch sử</p><h2>Atlas quốc kỳ</h2><p class="gallery-desc">Chọn một lá cờ để xem thông tin thời kỳ.</p></div><div class="page-indicator">${page+1} / ${totalPages}</div></div>
      <div class="country-grid">${shown.length?shown.map((i,k)=>`<button class="country-tile ${meta(i)?'hist':''}" data-flag="${i}" style="--i:${k}" title="${escapeText(name(i))}">${flag(i)}<span>${escapeText(name(i))}</span></button>`).join(''):'<div class="gallery-empty">Không có cờ nào đáp ứng các bộ lọc này.</div>'}</div>
      <div class="gallery-nav"><p><b>${matched.length} kết quả</b>. ${shown.length?`Đang xem ${page*PAGE_SIZE+1} đến ${page*PAGE_SIZE+shown.length}. `:''}Chọn cờ để xem chi tiết.</p><div class="gallery-nav-buttons"><button class="btn ghost small" id="prev" ${page===0?'disabled':''}>← Trước</button><button class="btn primary small" id="next-page" ${page>=totalPages-1?'disabled':''}>Tiếp →</button></div></div>
    </div></div>`;
  }
  function setPage(value){if(isTransitioning)return;const max=Math.max(1,Math.ceil(matchedRows().length/PAGE_SIZE));const dest=Math.min(max-1,Math.max(0,value));if(dest===page)return;page=dest;animateSwap(render);}
  function bindExplore(){
    stage.querySelectorAll('[data-feature]').forEach(b=>b.addEventListener('click',()=>{
      if(isTransitioning)return;
      const f=b.dataset.feature;
      selected=selected.includes(f)?selected.filter(x=>x!==f):[...selected,f];page=0;
      animateSwap(render);
    }));
    document.getElementById('reset').addEventListener('click',()=>{selected=[];page=0;animateSwap(render);});
    document.getElementById('prev').addEventListener('click',()=>setPage(page-1));
    document.getElementById('next-page').addEventListener('click',()=>setPage(page+1));
    stage.querySelectorAll('[data-flag]').forEach(b=>b.addEventListener('click',()=>openFlagDialog(Number(b.dataset.flag))));
  }
  const dialog=document.getElementById('flag-dialog');
  const dialogContent=document.getElementById('dialog-content');
  let priorDialogFocus=null;
  function closeFlagDialog(){
    dialog.hidden=true;dialogContent.innerHTML='';
    if(priorDialogFocus&&priorDialogFocus.isConnected)priorDialogFocus.focus({preventScroll:true});
    priorDialogFocus=null;
  }
  function openFlagDialog(i){
    priorDialogFocus=document.activeElement;
    const info=meta(i);
    const period=info?info.period:'Hình cờ tham khảo';
    const quality=info?info.quality:'Chưa xác thực độc lập biến thể tương ứng với từng năm trong nguồn UCI.';
    dialogContent.innerHTML=`<div>${flag(i)}</div><div><p class="tiny-label">Bản ghi ${i+1} / ${N}</p><h2 id="dialog-title">${escapeText(name(i))}</h2>
       <p class="note-period">${escapeText(period)}</p><p>${escapeText(quality)}</p>
       <p id="dialog-description">Đặc trưng dùng cho tính toán được lấy từ flag.data. Hình ảnh chỉ dùng để tra cứu và minh họa cho bản ghi.</p>
       <button class="btn primary" id="close-detail">Đóng chi tiết</button></div>`;
    dialog.hidden=false;
    document.getElementById('close-detail').addEventListener('click',closeFlagDialog);
    document.getElementById('close-detail').focus();
  }
  document.getElementById('dialog-close').addEventListener('click',closeFlagDialog);
  dialog.addEventListener('click',e=>{if(e.target===dialog)closeFlagDialog();});
  if(N!==194||F.length!==19||BANK.length<10){
    stage.textContent='Dữ liệu không hợp lệ. Vui lòng kiểm tra nguồn flag.data.';
    throw new Error('Invalid UCI dataset');
  }
  render();
})();

</script>
<script>

// Page-level deterrents only. Browsers retain control over developer tools.
(() => {
  'use strict';
  document.addEventListener('contextmenu', event => event.preventDefault(), {capture: true});
  document.addEventListener('keydown', event => {
    const key = event.key.toLowerCase();
    const ctrlOrCmd = event.ctrlKey || event.metaKey;
    const inspect = ctrlOrCmd && event.shiftKey && ['i', 'j', 'c', 'k'].includes(key);
    const macInspect = event.metaKey && event.altKey && ['i', 'j', 'c'].includes(key);
    const viewSource = ctrlOrCmd && !event.shiftKey && key === 'u';
    if (key === 'f12' || inspect || macInspect || viewSource) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, {capture: true});
})();

</script>
<script>
// Responsive helper: on small screens the page scrolls, so bring each new game screen into view.
(() => {
  const mq = window.matchMedia('(max-width:820px), (max-height:540px)');
  const stage = document.getElementById('stage');
  const head = document.getElementById('masthead');
  new MutationObserver(() => {
    if (!mq.matches) return;
    const panel = stage.firstElementChild;
    if (!panel) return;
    const offset = head.offsetHeight;
    if (panel.id === 'view-play') {
      const y = Math.max(0, stage.getBoundingClientRect().top + window.scrollY - offset);
      if (window.scrollY > y) window.scrollTo(0, y);
    } else {
      const gallery = stage.querySelector('.explore-gallery');
      if (gallery && gallery.getBoundingClientRect().top < offset) window.scrollTo(0, gallery.getBoundingClientRect().top + window.scrollY - offset - 8);
    }
  }).observe(stage, { childList: true });
})();
</script>
